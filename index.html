<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ritmo — Hábitos e itinerario</title>
<meta name="description" content="Sistema operativo personal de hábitos e itinerario. 100 % local: tus datos viven solo en tu teléfono.">
<meta name="theme-color" content="#f5f4f0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; script-src 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  --bg: #f5f4f0; --surface: #ffffff; --surface2: #efede7; --text: #1d1c1a; --muted: #6a675f; --line: #e4e1d9;
  --brand: #0b8f73; --brand-ink: #ffffff; --brand-soft: #dcf2ea; --brand-strong: #07705a;
  --danger: #c92a2a; --danger-soft: #fdeaea; --warn: #9a5b00; --warn-soft: #fff3d6;
  --c-salud: #d6336c; --c-mente: #7048e8; --c-trabajo: #1c7ed6; --c-vitalidad: #e0830a;
  --k-fixed: #5c6670; --k-deep: #5f3dc4; --k-recovery: #2b8a3e; --k-task: #1971c2;
  --e-high: #e8590c; --e-medium: #e0a800; --e-low: #3f8fd9;
  --h0: #e9e6df; --h1: #bfe6d8; --h2: #82d0b6; --h3: #3fb592; --h4: #0b8f73;
  --shadow: 0 1px 2px rgba(30, 28, 20, .06), 0 4px 14px rgba(30, 28, 20, .05);
  --r: 16px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131412; --surface: #1c1d1a; --surface2: #262723; --text: #eeede8; --muted: #a09d94; --line: #2f302b;
    --brand: #35c3a1; --brand-ink: #06231b; --brand-soft: #14382f; --brand-strong: #6fdcc0;
    --danger: #ff8787; --danger-soft: #3a1b1b; --warn: #ffc857; --warn-soft: #3a2f12;
    --c-salud: #f06595; --c-mente: #9775fa; --c-trabajo: #4dabf7; --c-vitalidad: #ffa94d;
    --k-fixed: #9aa4ad; --k-deep: #9775fa; --k-recovery: #69db7c; --k-task: #4dabf7;
    --e-high: #ff922b; --e-medium: #ffd43b; --e-low: #74c0fc;
    --h0: #2a2b27; --h1: #17463a; --h2: #1f6e58; --h3: #2a9c7d; --h4: #4fd8b4;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131412; --surface: #1c1d1a; --surface2: #262723; --text: #eeede8; --muted: #a09d94; --line: #2f302b;
  --brand: #35c3a1; --brand-ink: #06231b; --brand-soft: #14382f; --brand-strong: #6fdcc0;
  --danger: #ff8787; --danger-soft: #3a1b1b; --warn: #ffc857; --warn-soft: #3a2f12;
  --c-salud: #f06595; --c-mente: #9775fa; --c-trabajo: #4dabf7; --c-vitalidad: #ffa94d;
  --k-fixed: #9aa4ad; --k-deep: #9775fa; --k-recovery: #69db7c; --k-task: #4dabf7;
  --e-high: #ff922b; --e-medium: #ffd43b; --e-low: #74c0fc;
  --h0: #2a2b27; --h1: #17463a; --h2: #1f6e58; --h3: #2a9c7d; --h4: #4fd8b4;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 1.05rem; } h3 { font-size: .95rem; }
.muted { color: var(--muted); } .small { font-size: .82rem; } .tiny { font-size: .74rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.hidden { display: none !important; }

/* Estructura */
#app { max-width: 600px; margin: 0 auto; min-height: 100dvh; padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); }
.topbar .title { flex: 1; min-width: 0; }
.topbar .title h1 { font-size: 1.25rem; letter-spacing: -.01em; }
.topbar .title p { margin: 2px 0 0; }
.page { padding: 4px 16px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.page > * { min-width: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--text); }
.icon-btn svg, .nav svg, .btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
.nav-in { display: flex; width: 100%; max-width: 600px; }
.nav button { flex: 1; border: 0; background: none; padding: 9px 2px 8px; display: grid; justify-items: center; gap: 2px; font-size: .7rem; color: var(--muted); position: relative; }
.nav button[aria-current="page"] { color: var(--brand-strong); font-weight: 650; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }

/* Tarjetas y controles */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.soft { background: var(--brand-soft); border-color: transparent; color: var(--brand-strong); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.btn.block { width: 100%; } .btn.sm { min-height: 36px; padding: 0 12px; font-size: .88rem; }
.btn:disabled { opacity: .5; }
.link { background: none; border: 0; padding: 4px 0; color: var(--brand-strong); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface2); color: var(--muted); border: 1px solid transparent; white-space: nowrap; }
button.chip { min-height: 34px; }
button.chip[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-strong); border-color: var(--brand); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.scroll-x { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.scroll-x::-webkit-scrollbar { display: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--warn-soft); color: var(--warn); font-size: .9rem; }
.banner.info { background: var(--brand-soft); color: var(--brand-strong); }
.banner.bad { background: var(--danger-soft); color: var(--danger); }
.banner b { color: inherit; }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); }
.empty .big { font-size: 2rem; margin-bottom: 6px; }

/* Formularios */
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > label, .field > .lbl { font-size: .82rem; font-weight: 650; color: var(--muted); }
input[type=text], input[type=time], input[type=date], input[type=number], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); outline: none;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
.seg { display: flex; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 38px; border: 0; background: none; border-radius: 10px; font-size: .86rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.emoji-grid button { aspect-ratio: 1; border-radius: 10px; border: 1px solid transparent; background: var(--surface2); font-size: 1.15rem; }
.emoji-grid button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.daypick { display: flex; gap: 6px; }
.daypick button { flex: 1; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; }
.daypick button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

/* Progreso */
.progress { height: 12px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--h3)); transition: width .45s cubic-bezier(.2, .8, .2, 1); }
.big-num { font-size: 2rem; font-weight: 750; letter-spacing: -.02em; line-height: 1; }

/* Hábitos y bloques */
.list { display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.item.stacked { margin-left: 22px; position: relative; }
.item.stacked::before { content: ""; position: absolute; left: -14px; top: -9px; width: 12px; height: 32px; border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); border-radius: 0 0 0 8px; }
.item.done .nm { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.chk { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; color: transparent; transition: .15s; }
.chk svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chk[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.chk.mini[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-strong); border-color: var(--brand); }
.item .body { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; }
.item .nm { font-weight: 650; overflow-wrap: anywhere; }
.item .sub { font-size: .78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 2px; }
.streak { font-weight: 700; color: var(--e-high); font-size: .85rem; white-space: nowrap; }
.streak.risk { color: var(--warn); }
.mini-btn { border: 1px dashed var(--line); background: none; border-radius: 10px; min-width: 44px; min-height: 34px; font-size: .74rem; font-weight: 700; color: var(--muted); }
.ico { font-size: 1.35rem; width: 30px; text-align: center; flex: none; }
.kbar { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
.time { font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--muted); min-width: 46px; }
.energy { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; vertical-align: middle; }
.energy i { width: 4px; border-radius: 1px; background: var(--line); }
.energy i:nth-child(1) { height: 5px; } .energy i:nth-child(2) { height: 8px; } .energy i:nth-child(3) { height: 12px; }
.energy.high i, .energy.medium i:nth-child(-n+2), .energy.low i:nth-child(1) { background: currentColor; }
.energy.high { color: var(--e-high); } .energy.medium { color: var(--e-medium); } .energy.low { color: var(--e-low); }
.warn-t { color: var(--warn); font-weight: 600; }

/* Mapa de calor y gráficos */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--h0); }
.heat i[data-l="1"] { background: var(--h1); } .heat i[data-l="2"] { background: var(--h2); }
.heat i[data-l="3"] { background: var(--h3); } .heat i[data-l="4"] { background: var(--h4); }
.heat i[data-l="-1"] { background: transparent; } .heat i[data-l="-2"] { background: transparent; box-shadow: inset 0 0 0 1px var(--h0); }
.heat i.today { outline: 2px solid var(--text); outline-offset: 1px; }
.legend { display: flex; align-items: center; gap: 4px; font-size: .72rem; color: var(--muted); }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface2); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-size: 1.35rem; letter-spacing: -.02em; }
.stat span { font-size: .74rem; color: var(--muted); }
svg.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.rate-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: .88rem; margin-bottom: 10px; }
.rate-row .progress { grid-column: 1 / -1; height: 8px; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.strip button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 0; display: grid; justify-items: center; gap: 3px; font-size: .7rem; color: var(--muted); }
.strip button b { font-size: 1rem; color: var(--text); }
.strip button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.strip button[aria-pressed="true"] b { color: var(--brand-ink); }
.strip button.today:not([aria-pressed="true"]) b { color: var(--brand-strong); }
.pip { width: 6px; height: 6px; border-radius: 50%; background: var(--h0); }
.pip.on { background: var(--h4); }
.mood { display: flex; gap: 6px; }
.mood button { flex: 1; font-size: 1.4rem; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.mood button[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); }
.fab { position: fixed; z-index: 25; right: max(16px, calc(50% - 284px)); bottom: calc(80px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
.fab svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }

/* Hojas modales y avisos */
.backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(10, 10, 8, .5); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
.sheet { width: 100%; max-width: 600px; max-height: 92dvh; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .22s cubic-bezier(.2, .8, .2, 1); overscroll-behavior: contain; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; position: sticky; top: -8px; background: var(--bg); padding: 4px 0; z-index: 1; }
.sheet-h h2 { font-size: 1.15rem; }
.actions { display: grid; gap: 8px; margin-top: 6px; }
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: min(92vw, 520px); background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: .9rem; font-weight: 550; animation: up .2s; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
.toast.bad { background: var(--danger); color: #fff; }
.toast { pointer-events: none; } #upd { pointer-events: auto; }
.tip { border-left: 3px solid var(--brand); padding: 2px 0 2px 12px; margin: 10px 0; }
.tip b { display: block; }
details { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 2px 14px; margin-bottom: 8px; }
summary { cursor: pointer; font-weight: 650; padding: 12px 0; }
details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 8px; }
details > div { padding-bottom: 10px; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
<div id="app"><div class="page" style="padding-top:60px;text-align:center"><p class="muted">Cargando Ritmo…</p></div></div>
<noscript><p style="padding:24px">Ritmo necesita JavaScript para funcionar.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
